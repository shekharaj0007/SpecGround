services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: specground
      POSTGRES_PASSWORD: specground
      POSTGRES_DB: specground
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U specground -d specground"]
      interval: 5s
      timeout: 5s
      retries: 12

  backend:
    build: ./backend
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://specground:specground@postgres:5432/specground
      UPLOAD_DIR: /data/uploads
      CORS_ORIGINS: http://localhost:3000,http://localhost:5173
    volumes:
      - uploads:/data/uploads
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  pgdata:
  uploads:
